<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Mini Launcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>
    <div id="mode" hidden></div>
  </header>

  <main>
    <div id="grid" role="grid"></div>
  </main>

  <footer>
    <span><i class="k red"></i>Move</span>
    <span><i class="k yellow"></i>Hide / unhide</span>
    <span><i class="k blue"></i>Show hidden</span>
  </footer>

  <script src="apps.js"></script>
  <script src="main.js"></script>
</body>
</html>
