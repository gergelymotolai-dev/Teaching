<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Mini Launcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wallpaper" aria-hidden="true">
    <div class="wp" id="wp-a"></div>
    <div class="wp" id="wp-b"></div>
    <div class="scrim"></div>
  </div>

  <header>
    <div class="time">
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>
    <div id="weather" hidden>
      <div class="now">
        <span id="w-icon"></span>
        <span id="w-temp"></span>
      </div>
      <div id="w-desc"></div>
      <div id="w-range"></div>
    </div>
  </header>

  <div id="mode" hidden></div>

  <section id="row">
    <div id="track" role="listbox"></div>
  </section>

  <footer>
    <div id="hints">
      <span><i class="k red"></i>Move</span>
      <span><i class="k yellow"></i>Hide / unhide</span>
      <span><i class="k blue"></i>Show hidden</span>
    </div>
    <span id="credit"></span>
  </footer>

  <script src="apps.js"></script>
  <script src="main.js"></script>
  <script src="weather.js"></script>
  <script src="wallpaper.js"></script>
</body>
</html>
